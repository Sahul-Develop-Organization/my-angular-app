<div class="app-container" fxLayout="column">
  <!-- Header -->
  <mat-toolbar color="primary" class="header mat-elevation-z4">
    <button mat-icon-button (click)="sidenav.toggle()" fxHide.gt-sm>
      <mat-icon>menu</mat-icon>
    </button>
    
    <div class="logo" fxLayout="row" fxLayoutAlign="center center">
      <mat-icon class="logo-icon">storefront</mat-icon>
      <span class="logo-text">LuxeStore</span>
    </div>

    <span class="spacer"></span>

    <!-- Search bar (hidden on small screens) -->
    <div class="search-bar" fxHide.lt-md>
      <mat-icon class="search-icon">search</mat-icon>
      <input type="text" placeholder="Search products..." class="search-input">
    </div>

    <span class="spacer"></span>

    <div class="actions" fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="12px">
      <button mat-icon-button class="action-btn">
        <mat-icon matBadge="{{cartItemCount}}" matBadgeColor="accent">shopping_cart</mat-icon>
      </button>
      <button mat-icon-button class="action-btn">
        <mat-icon>person</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <!-- Body -->
  <mat-sidenav-container fxFlex class="sidenav-container">
    
    <!-- Sidebar -->
    <mat-sidenav #sidenav mode="side" opened="true" class="sidebar" fxFlex="20" fxFlex.lt-md="0" fxHide.lt-md>
      <div class="sidebar-header">
        <h3>Categories</h3>
      </div>
      <div class="category-list">
        <button mat-button class="category-btn" *ngFor="let cat of categories">
          {{cat}}
        </button>
      </div>
    </mat-sidenav>

    <!-- Content -->
    <mat-sidenav-content class="content">
      
      <!-- Hero Banner -->
      <div class="hero-banner" fxLayout="column" fxLayoutAlign="center center">
        <h1>Discover Premium Products</h1>
        <p>Curated collection of the best items for your lifestyle.</p>
        <button mat-raised-button color="accent" class="shop-now-btn">Shop Now</button>
      </div>

      <!-- Product Grid -->
      <div class="product-grid" fxLayout="row wrap" fxLayoutGap="24px grid">
        <div fxFlex="25" fxFlex.lg="33.33" fxFlex.md="50" fxFlex.sm="50" fxFlex.xs="100" *ngFor="let product of products">
          <mat-card class="product-card mat-elevation-z2">
            <div class="image-wrapper">
              <img mat-card-image [src]="product.image" alt="{{product.title}}">
              <div class="category-badge">{{product.category}}</div>
            </div>
            <mat-card-content class="card-content">
              <div fxLayout="row" fxLayoutAlign="space-between start">
                <h3 class="product-title">{{product.title}}</h3>
                <div class="rating">
                  <mat-icon class="star-icon">star</mat-icon>
                  <span>{{product.rating}}</span>
                </div>
              </div>
              <div class="price">${{product.price}}</div>
            </mat-card-content>
            <mat-card-actions class="card-actions">
              <button mat-button color="primary" class="add-btn">Add to Cart</button>
              <button mat-icon-button color="accent"><mat-icon>favorite_border</mat-icon></button>
            </mat-card-actions>
          </mat-card>
        </div>
      </div>

    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
